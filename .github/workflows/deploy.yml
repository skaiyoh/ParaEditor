name: Check and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Keep a deployment's preview, promotion, and final checks together.
concurrency:
  group: noisy-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  check-and-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '25.4.0'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Fetch and verify pinned models
        run: node tools/fetch-models.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Build development and production
        run: |
          npm run build
          npm run build:production
      - name: Test without Chrome
        run: |
          # serve.test.ts and serve-production.test.ts can hang the runner (plan/findings.tsv F13); they run on the Mac before each export.
          mapfile -t tests < <(find test -maxdepth 1 -name '*.test.ts' ! -name 'drive-chrome.test.ts' ! -name 'serve.test.ts' ! -name 'serve-production.test.ts' | sort)
          node --test --test-timeout=60000 "${tests[@]}" test/cloudflare-credentials.test.mjs
      - name: Deploy and verify Cloudflare
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/cloudflare/ci.mjs
