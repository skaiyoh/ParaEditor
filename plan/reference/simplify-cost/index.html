  for (const r of (q.get('radii') || '6,12.5,24').split(',').map(Number)) {
    rerunDirty(div, r, 0.6, null, label, false);                        // state 1: whole frame, old label
    const before = readFinal();
    rerunDirty(div, 24 - r / 2, 0.1, null, label2, true);               // leave stale, unrelated contents in every working-grid target
    const t0 = performance.now(); rerunDirty(div, r, 0.6, C, label2, false); const ms = performance.now() - t0;   // the dirty rerun: new label, scissored
    const dirty = readFinal();
    rerunDirty(div, r, 0.6, null, label2, false);                       // the reference: whole frame, new label
    const full = readFinal();
    let diff = 0, changed = 0; for (let i = 0; i < full.length; i++) { if (dirty[i] !== full[i]) diff++; if (before[i] !== full[i]) changed++; }
    out.push(`dirty rectangle r=${r}px: bytes differing from the whole-frame rerun = ${diff} of ${full.length}; bytes the label change altered = ${changed}; dirty rerun ${ms.toFixed(1)} ms  err=${gl.getError()}`);
  }
} else if (mode === 'ring'){
  // Round 5 (AUDIT-2): does background color ride along inside an object's mask? A two-label fixture of two flat colors, a white sphere
  // (label 1) on a black background, at clarity 0 so no detail is added back above the detail weight d = max(0, 1 - r / 8).
  rerun(4, 0, 0, null, true); gl.bindFramebuffer(gl.FRAMEBUFFER, final.fb); const a0 = new Uint8Array(4*64*64); gl.readPixels(700, 500, 64, 64, gl.RGBA, gl.UNSIGNED_BYTE, a0);
  let maxDiff = 0; for (let y=0;y<64;y++) for (let x=0;x<64;x++) for (let k=0;k<3;k++){ const dv = Math.abs(a0[(y*64+x)*4+k] - px[((500+y)*W + 700+x)*4+k]); if (dv > maxDiff) maxDiff = dv; }
  out.push(`identity at simplify 0 (r=0, d=1) on the quarter grid, label-aware downsample: max abs difference from the master over a 64x64 patch = ${maxDiff} of 255`);
  const flat = new Uint8Array(W*H*4); const lblAt = (x, y) => lab[Math.min(LH-1, Math.floor((y+0.5)/H*LH))*LW + Math.min(LW-1, Math.floor((x+0.5)/W*LW))];
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) { const v = lblAt(x, y) ? 255 : 0; const i = (y*W+x)*4; flat[i] = flat[i+1] = flat[i+2] = v; flat[i+3] = 255; }
  gl.bindTexture(gl.TEXTURE_2D, master.t); gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, flat);
  for (const aware of [0, 1]) for (const r of (q.get('radii') || '8,12.5,24').split(',').map(Number)) {
    AWARE = aware; rerun(4, r, 0, null, true); const f = readFinal();
    let inObj = 0, objMoved = 0, objWorst = 0, inBg = 0, bgMoved = 0, bgWorst = 0;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) { const v = f[(y*W+x)*4];
      if (lblAt(x, y)) { inObj++; const d = 255 - v; if (d > 2) objMoved++; if (d > objWorst) objWorst = d; }
      else { inBg++; if (v > 2) bgMoved++; if (v > bgWorst) bgWorst = v; } }
    out.push(`ring r=${r}px d=${Math.max(0, 1 - r/8).toFixed(2)} ${aware ? 'label-aware downsample' : 'plain box downsample (round 4)'}: object texels moved toward the background by more than 2 of 255 = ${objMoved} of ${inObj} (worst ${objWorst}); background texels moved toward the object = ${bgMoved} of ${inBg} (worst ${bgWorst})  err=${gl.getError()}`);
  }
} else if (mode === 'time'){
  const reps = Number(q.get('reps') || 6);
  for (const div of (q.get('divs') || '4,3,2').split(',').map(Number)) for (const r of (q.get('radii') || '6,12.5,24').split(',').map(Number)) time(div, r, reps, null);
  // an object-sized dirty rectangle: the sphere's bounds dilated by the filter's reach (about 40% x 50% of the frame)
  for (const div of (q.get('divs') || '4,3,2').split(',').map(Number)) time(div, 24, reps, [0.2, 0.15, 0.4, 0.5]);
  if (q.get('ref')) { time(1, 6, 2, null); time(1, 12.5, 1, null); }
} else {
  const crop = [480, 560, 900, 675];                                   // sphere edge, shadow, checker ground, horizon
  const r = Number(q.get('r') || 12.5); const lineW = 2.4;
  rerun(1, 0, 0, null, true); shot('master', ...crop, 0, 0, 1);
  for (const div of (q.get('divs') || '4,3,2').split(',').map(Number)) {
    rerun(div, r, 0.6, null, true); shot(`div${div}-r${r}-simplified`, ...crop, 0, 0, div); shot(`div${div}-r${r}-bands-lines`, ...crop, lineW, 5, div); }
  if (q.get('ref')) { rerun(1, r, 0.6, null, true); shot(`ref-div1-r${r}-simplified`, ...crop, 0, 0, 1); shot(`ref-div1-r${r}-bands-lines`, ...crop, lineW, 5, 1); }
  rerun(4, 0, 0, null, true); gl.bindFramebuffer(gl.FRAMEBUFFER, final.fb); const a = new Uint8Array(4*64*64); gl.readPixels(700, 500, 64, 64, gl.RGBA, gl.UNSIGNED_BYTE, a);
  let maxDiff = 0; for (let y=0;y<64;y++) for (let x=0;x<64;x++) for (let k=0;k<3;k++){ const dv = Math.abs(a[(y*64+x)*4+k] - px[((500+y)*W + 700+x)*4+k]); if (dv > maxDiff) maxDiff = dv; }
  out.push(`identity at simplify 0 (r=0, d=1) on the quarter grid: max abs difference from the master over a 64x64 patch = ${maxDiff} of 255`);
}
} catch (e) { out.push('ERROR ' + (e && e.message || e)); }
document.getElementById('o').textContent = out.join('\n') + '\nDONE';
})();
